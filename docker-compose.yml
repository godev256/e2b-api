# Local stack for the E2B sandbox API assignment.
#
# | Service            | URL                                      | Notes                                   |
# |--------------------|------------------------------------------|-----------------------------------------|
# | api                | http://localhost:8080                    | our service                             |
# | PostgreSQL         | postgres://e2b:e2b@localhost:5432/e2b    | application database                    |
# | Redis              | localhost:6379                           | no auth                                 |
# | Ory Hydra (public) | http://localhost:4444                    | OAuth2 provider (fixture)               |
# | Ory Hydra (admin)  | http://localhost:4445                    | used by consent app and bootstrap job   |
# | Demo login page    | http://localhost:3000                    | test user: foo@bar.com / foobar         |
#
# OAuth2 client (pre-created by hydra-bootstrap):
#   client id: e2b-assignment, secret: e2b-assignment-secret
#   redirect URI: http://localhost:8080/auth/callback, scopes: openid offline
#
# Hydra keeps its state in memory: the client is re-created on every
# `docker compose up`, and sessions are lost when it restarts.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: e2b
      POSTGRES_PASSWORD: e2b
      POSTGRES_DB: e2b
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2b -d e2b"]
      interval: 2s
      timeout: 2s
      retries: 15

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  # --- OAuth2 provider (a fixture, not part of the exercise) ---------------
  hydra:
    image: oryd/hydra:v2.2.0
    command: serve all --dev
    environment:
      DSN: memory
      URLS_SELF_ISSUER: http://localhost:4444
      URLS_LOGIN: http://localhost:3000/login
      URLS_CONSENT: http://localhost:3000/consent
      SECRETS_SYSTEM: insecure-assignment-only-system-secret
      STRATEGIES_ACCESS_TOKEN: jwt # access tokens are JWTs, verifiable via /.well-known/jwks.json
      LOG_LEVEL: warn
    ports:
      # Published on loopback only. The admin API has no authentication: anyone
      # who can reach 4445 can log in as any user.
      - "127.0.0.1:4444:4444" # public: /oauth2/auth, /oauth2/token, /userinfo
      - "127.0.0.1:4445:4445" # admin (used by the consent app and the bootstrap job)
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:4445/health/ready"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Demo login and consent UI for Hydra. Test user: foo@bar.com / foobar
  hydra-login-consent:
    image: oryd/hydra-login-consent-node:v2.2.0
    platform: linux/amd64 # no arm64 image published; runs emulated on Apple Silicon
    environment:
      HYDRA_ADMIN_URL: http://hydra:4445
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 3s
      timeout: 3s
      retries: 40
    depends_on:
      hydra:
        condition: service_healthy

  # One-shot job: creates the OAuth2 client our service uses.
  hydra-bootstrap:
    image: curlimages/curl:8.7.1
    depends_on:
      hydra:
        condition: service_healthy
    restart: "no"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        body='{
          "client_id": "e2b-assignment",
          "client_secret": "e2b-assignment-secret",
          "client_name": "E2B Backend Assignment",
          "grant_types": ["authorization_code", "refresh_token"],
          "response_types": ["code"],
          "scope": "openid offline",
          "redirect_uris": ["http://localhost:8080/auth/callback"],
          "token_endpoint_auth_method": "client_secret_basic"
        }'
        status=$$(curl -s -o /tmp/out -w '%{http_code}' \
          -X POST http://hydra:4445/admin/clients \
          -H 'Content-Type: application/json' \
          -d "$$body")
        if [ "$$status" = "201" ] || [ "$$status" = "409" ]; then
          echo "OAuth2 client 'e2b-assignment' is ready"
        else
          echo "Failed to create OAuth2 client (HTTP $$status):" && cat /tmp/out && exit 1
        fi

  # --- Our service ----------------------------------------------------------
  # One-shot job: applies embedded SQL migrations.
  migrate:
    build: .
    image: e2b-api:local
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://e2b:e2b@postgres:5432/e2b?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    image: e2b-api:local
    command: ["serve"]
    restart: unless-stopped
    # Longer than the 20s drain in the app, so Docker does not kill it mid-drain.
    stop_grace_period: 30s
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://e2b:e2b@postgres:5432/e2b?sslmode=disable
      REDIS_ADDR: redis:6379
      # The issuer must match the `iss` claim in tokens (what Hydra advertises).
      HYDRA_ISSUER: http://localhost:4444
      # The browser talks to localhost, the container talks to the compose network.
      HYDRA_AUTH_URL: http://localhost:4444/oauth2/auth
      HYDRA_TOKEN_URL: http://hydra:4444/oauth2/token
      HYDRA_JWKS_URL: http://hydra:4444/.well-known/jwks.json
      OAUTH_CLIENT_ID: e2b-assignment
      OAUTH_CLIENT_SECRET: e2b-assignment-secret
      OAUTH_REDIRECT_URL: http://localhost:8080/auth/callback
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      hydra:
        condition: service_healthy
      hydra-bootstrap:
        condition: service_completed_successfully
      hydra-login-consent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/api", "healthcheck"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
